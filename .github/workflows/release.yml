name: Windows-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Versienummer voor de GitHub-release, bijvoorbeeld v1.0.1
        required: true
        default: v1.0.1

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Broncode ophalen
        uses: actions/checkout@v4

      - name: .NET installeren
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Windows-app bouwen
        shell: pwsh
        run: dotnet publish .\app\Werkdagboek.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --output .\publish

      - name: Downloadpakket maken
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE "Dagverslag"
          New-Item -ItemType Directory -Force -Path (Join-Path $package "media") | Out-Null
          Copy-Item .\publish\Dagverslag.exe $package
          Copy-Item .\app\media\logo.png (Join-Path $package "media\logo.png")
          @"
          DAGVERSLAG INSTALLEREN

          1. Pak Dagverslag-windows-x64.zip uit.
          2. Laat Dagverslag.exe en de map media bij elkaar staan.
          3. Start Dagverslag.exe.

          De app is zelfstandig en vereist geen aparte .NET-installatie.
          Dagverslagen worden opgeslagen in Documenten\Lucas erf onderhoud\Dagverslagen.
          "@ | Set-Content -Path (Join-Path $package "LEESMIJ.txt") -Encoding utf8
          Compress-Archive -Path (Join-Path $package "*") -DestinationPath .\Dagverslag-windows-x64.zip -Force

      - name: GitHub-release publiceren
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Dagverslag ${{ inputs.version || github.ref_name }}
          generate_release_notes: true
          files: Dagverslag-windows-x64.zip
